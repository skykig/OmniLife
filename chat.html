<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OmniLife AI</title>

<link rel="stylesheet" href="chat.css">

</head>

<body>

<div class="app">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">
            <h2>✨ OmniLife</h2>
        </div>

        <button id="newChatBtn" class="new-chat">
            + New Chat
        </button>

        <div id="history" class="history">

        </div>

        <div class="sidebar-bottom">

            <div class="menu-item">
                👤 Profile
            </div>

            <div class="menu-item">
                ⚙ Settings
            </div>

            <div class="menu-item">
                🚪 Logout
            </div>

        </div>

    </aside>



    <!-- Main -->

    <main class="main">

        <header class="header">

            <div class="title">

                <h1>🤖 Nova AI</h1>

                <span>
                    OmniLife Personal Assistant
                </span>

            </div>

        </header>



        <!-- Chat -->

        <div id="chatBox" class="chat-box">

            <div class="message ai">

                <div class="avatar">
                    🤖
                </div>

                <div class="bubble">

                    <strong>Hello 👋</strong>

                    <br><br>

                    I am Nova AI.

                    <br>

                    How can I help you today?

                </div>

            </div>

        </div>



        <!-- Typing -->

        <div id="typing" class="typing hidden">

            <span></span>

            <span></span>

            <span></span>

        </div>



        <!-- Input -->

        <div class="input-area">

            <textarea

                id="userInput"

                rows="1"

                placeholder="Message Nova AI..."

            ></textarea>

            <button id="sendBtn">

                ➤

            </button>

        </div>

    </main>

</div>

<script src="chat.js"></script>

</body>
</html>
