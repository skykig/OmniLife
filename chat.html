<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniLife AI Chat</title>

    <link rel="stylesheet" href="chat.css">
</head>
<body>

<div class="sidebar">
    <h2>OmniLife</h2>

   <h2>OmniLife</h2>

<button id="newChatBtn">+ New Chat</button>

<ul class="history">

    <li>💬 New Conversation</li>
    <li>📝 My Notes</li>
    <li>🌍 Travel Planner</li>
    <li>💼 Business Ideas</li>

</ul>

<div class="bottom-menu">

    <p>👤 Profile</p>
    <p>⚙️ Settings</p>
    <p>🚪 Logout</p>

</div>

    <div id="messages" class="messages">

        <div class="ai-message">
            Hello 👋<br>
            I am Omni AI.<br>
            How can I help you today?
        </div>

    </div>

    <div class="chat-input">

        <input
            type="text"
            id="userInput"
            placeholder="Type your message...">

        <button id="sendBtn">
            Send
        </button>

    </div>

</div>

<script src="chat.js"></script>

</body>
</html>
